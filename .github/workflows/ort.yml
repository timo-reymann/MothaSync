name: ORT License Compliance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  license-check:
    uses: timo-reymann/.github/.github/workflows/ort.yml@main
    with:
      # Copy of the default filter from timo-reymann/.github plus the files that
      # declare the script-fetched rclone binary.
      ort-filter-config: |-
        dependencies:
          - "scripts/download-rclone.sh"
          - "packaging/ort/rclone.spdx.yml"
          - "go.mod"
          - "**/go.mod"
          - "go.sum"
          - "**/go.sum"
          - "package.json"
          - "**/package.json"
          - "package-lock.json"
          - "**/package-lock.json"
          - "yarn.lock"
          - "**/yarn.lock"
          - "pnpm-lock.yaml"
          - "**/pnpm-lock.yaml"
          - "Cargo.toml"
          - "**/Cargo.toml"
          - "Cargo.lock"
          - "**/Cargo.lock"
          - "requirements.txt"
          - "**/requirements.txt"
          - "pyproject.toml"
          - "**/pyproject.toml"
          - "poetry.lock"
          - "**/poetry.lock"
          - "pom.xml"
          - "**/pom.xml"
          - "build.gradle"
          - "**/build.gradle"
          - "build.gradle.kts"
          - "**/build.gradle.kts"
          - "*.csproj"
          - "**/*.csproj"
          - "Directory.Packages.props"
          - "**/Directory.Packages.props"
          - "packages.lock.json"
          - "**/packages.lock.json"
          - "Gemfile"
          - "**/Gemfile"
          - "composer.json"
          - "**/composer.json"
          - "composer.lock"
          - "**/composer.lock"
          - "LICENSE"
          - "**/LICENSE"
          - "NOTICE"
          - "**/NOTICE"
          - ".ort.yml"
