excludes:
  paths:
    - pattern: "src/MothaSync.Client/Assets/rclone/COPYING"
      reason: "OTHER"
      comment: >-
        License of the rclone binary. The build fetches rclone with scripts/download-rclone.sh.
        The ORT analyzer declares rclone as a package in packaging/ort/rclone.spdx.yml instead.
    - pattern: "tests/**"
      reason: "TEST_OF"
      comment: "Unit test projects; test tooling is not shipped with the application."
curations:
  packages:
    # renovate: datasource=github-releases depName=rclone/rclone
    - id: "SpdxDocumentFile::rclone:v1.76.0"
      curations:
        comment: "ORT resolves the SPDX package to the repository that holds packaging/ort/rclone.spdx.yml, so point it at the rclone source to get its real license and copyright."
        vcs:
          type: "Git"
          url: "https://github.com/rclone/rclone.git"
          # renovate: datasource=github-releases depName=rclone/rclone
          revision: "v1.76.0"
          path: ""
    - id: "NuGet:Avalonia.Angle:Windows.Natives"
      curations:
        comment: "License URL on nuget.org cannot be parsed as SPDX; the package is BSD-3-Clause licensed."
        concluded_license: "BSD-3-Clause"
    - id: "NuGet:Google:Protobuf:3.36.2"
      curations:
        comment: "Package is licensed under BSD-3-Clause; the scanner only reports the scancode protobuf LicenseRef."
        concluded_license: "BSD-3-Clause"
    # .NET 11 packages resolve their source to the dotnet/dotnet unified repository. Cloning and scanning
    # that multi-gigabyte tree exceeds the scan step budget, so conclude the licenses from the package
    # metadata on nuget.org instead. The ids stay version-less, so patch updates stay covered.
    - id: "NuGet:Microsoft.AspNetCore:WebUtilities"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Configuration"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Configuration.Binder"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Configuration.CommandLine"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Configuration.EnvironmentVariables"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Configuration.FileExtensions"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Configuration.Json"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Configuration.UserSecrets"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Diagnostics"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:FileProviders.Physical"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:FileSystemGlobbing"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Hosting"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Logging"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Logging.Configuration"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Logging.Console"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Logging.Debug"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Logging.EventLog"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Logging.EventSource"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Extensions:Options.ConfigurationExtensions"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:Microsoft.Net:Http.Headers"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:System.Diagnostics:EventLog"
      curations:
        concluded_license: "MIT"
    - id: "NuGet:SQLitePCLRaw:bundle_e_sqlite3"
      curations:
        comment: >-
          Package metadata has no VCS revision, so ORT resolves the tip of the SQLitePCL.raw repository
          and scans the same provenance as the packages that declare the revision explicitly. That
          produces duplicate scan results, so pin the revision of the 3.0.5 packages here.
        vcs:
          type: "Git"
          url: "https://github.com/ericsink/SQLitePCL.raw.git"
          revision: "ed046114d5a30534e13294d94d78eb73de896ad4"
          path: ""
resolutions:
  issues:
    - message: "(?s).*Could not resolve provenance for package 'NuGet:.*"
      reason: "CANT_FIX_ISSUE"
      comment: "NuGet metadata of these third-party packages (SkiaSharp, HarfBuzzSharp, SQLitePCLRaw, System.Memory, ...) has no resolvable source repository or revision, so the source cannot be scanned. License information is taken from the package metadata."
    - message: "(?s).*Could not resolve nested provenance for package 'NuGet:Avalonia.Angle:.*"
      reason: "CANT_FIX_ISSUE"
      comment: "The ANGLE repository has a submodule hosted on a private chrome-internal.googlesource.com remote that cannot be cloned. The Windows natives package is BSD-3-Clause licensed."
  rule_violations:
    - message: "The declared license 'https://www.nuget.org/packages/Avalonia.Angle.Windows.Natives/.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "License URL on nuget.org cannot be parsed as SPDX; the package is BSD-3-Clause licensed, see the curation above."
